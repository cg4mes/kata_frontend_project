version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    S3_BUCKET: "kata-frontend-production"
    CLOUDFRONT_DISTRIBUTION_ID: "CLOUDFRONT_DISTRIBUTION_ID"
    ENVIRONMENT: "production"
    VITE_API_URL: "https://api.appKata.com"
    VITE_ENVIRONMENT: "production"

phases:
  pre_build:
    commands:
      - echo "=== Pre-Build Phase - Production Environment ==="
      - echo "Installing dependencies..."
      - npm ci
      - echo "Environment configuration:"
      - echo "API URL will be $VITE_API_URL"
      - echo "S3 Bucket: $S3_BUCKET"
      - echo "CloudFront Distribution: $CLOUDFRONT_DISTRIBUTION_ID"
      
  build:
    commands:
      - echo "=== Build Phase ==="
      - echo "Build started on `date`"
      - echo "Building the React application with Vite..."
      - npm run build
      - echo "Build completed successfully"
      - echo "Build output:"
      - ls -lah dist/
      
  post_build:
    commands:
      - echo "=== Post-Build Phase ==="
      - echo "Syncing files to S3 bucket..."
      - aws s3 sync dist/ s3://$S3_BUCKET/ --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
      - aws s3 cp dist/index.html s3://$S3_BUCKET/index.html --cache-control "public,max-age=0,must-revalidate"
      - echo "Files uploaded to S3 successfully"
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
      - echo "CloudFront cache invalidated successfully"
      - echo "Deployment completed on `date`"

cache:
  paths:
    - 'node_modules/**/*'
