name: Deploy Frontend to QA

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/deploy-qa.yml'

env:
  AWS_REGION: us-east-1
  S3_BUCKET: kata-frontend-qa
  CLOUDFRONT_DISTRIBUTION_ID: YOUR_QA_DISTRIBUTION_ID

jobs:
  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_QA }}
          VITE_ENVIRONMENT: qa
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Frontend deployed successfully to QA environment"
          echo "URL: https://qa.yourapp.com"
