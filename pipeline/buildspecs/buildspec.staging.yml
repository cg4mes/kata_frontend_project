version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    AWS_ACCOUNT_ID: "YOUR_AWS_ACCOUNT_ID"
    IMAGE_REPO_NAME: "kata-frontend"
    ENVIRONMENT: "staging"
    VITE_API_URL: "https://api-staging.yourapp.com"
    VITE_ENVIRONMENT: "staging"

phases:
  pre_build:
    commands:
      - echo "=== Pre-Build Phase - Staging Environment ==="
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=staging-${COMMIT_HASH:=latest}
      - echo "Image will be tagged as $IMAGE_TAG"
      - echo "API URL will be $VITE_API_URL"
      
  build:
    commands:
      - echo "=== Build Phase ==="
      - echo "Build started on `date`"
      - echo "Building the Docker image with Staging configuration..."
      - |
        docker build \
          --build-arg VITE_API_URL=$VITE_API_URL \
          --build-arg VITE_ENVIRONMENT=$VITE_ENVIRONMENT \
          -t $REPOSITORY_URI:latest \
          -t $REPOSITORY_URI:$IMAGE_TAG \
          -t $REPOSITORY_URI:staging-latest .
      - echo "Docker image built successfully"
      
  post_build:
    commands:
      - echo "=== Post-Build Phase ==="
      - echo "Build completed on `date`"
      - echo "Pushing the Docker images..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:staging-latest
      - echo "Docker images pushed successfully"
      - echo "Writing image definitions file..."
      - printf '[{"name":"kata-frontend","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - echo "Updating task definition with new image..."
      - sed -i "s|\${image_url}|$REPOSITORY_URI:$IMAGE_TAG|g" pipeline/service/task-definition.staging.json
      - cat pipeline/service/task-definition.staging.json
      - echo "Deployment artifacts created successfully"

artifacts:
  files:
    - imagedefinitions.json
    - pipeline/service/task-definition.staging.json

cache:
  paths:
    - '/root/.npm/**/*'
    - 'node_modules/**/*'
